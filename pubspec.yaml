
name: digikhata
description: "Digital bookkeeping, customer credit, inventory and business reports for shopkeepers."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43,
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in a Flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions,
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# packages can be manually updated by changing the version numbers below to
# the latest version available on pub.dev.
# To see which dependencies have newer versions, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Flutter localization support for English and Urdu.
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  supabase_flutter: ^2.18.3
  intl: ^0.20.2
  uuid: ^4.6.0
  share_plus: ^13.3.1
  pdf: ^3.13.1
  printing: ^5.15.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set is activated in the
  # `analysis_options.yaml` file located at the root of your package.
  # See that file for information about deactivating specific lint rules.
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.6
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#F7F9F8"
  image: assets/branding/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F7F9F8"
    image: assets/branding/splash_logo.png
    icon_background_color: "#F7F9F8"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F7F9F8"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

